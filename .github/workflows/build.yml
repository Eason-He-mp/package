name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 检出代码（包含 Tesseract ZIP）
        uses: actions/checkout@v6

      - name: 设置 Python (32-bit)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 解压 32 位 Tesseract 便携版
        shell: pwsh
        run: |
          Expand-Archive -Path "Tesseract-OCR.zip" -DestinationPath C:\tesseract -Force
          # 验证实际路径（ZIP 内包含 Tesseract-OCR 文件夹）
          if (!(Test-Path "C:\tesseract\Tesseract-OCR\tesseract.exe")) { Write-Error "tesseract.exe 未找到"; exit 1 }
          if (!(Test-Path "C:\tesseract\Tesseract-OCR\tessdata\eng.traineddata")) { Write-Error "eng.traineddata 未找到"; exit 1 }
          Write-Host "Tesseract 验证通过"

      - name: 打包 CT 扫描主程序
        run: |
          pyinstaller --onefile --windowed --name CT_Scan_Tool 2D_scan.py `
            --add-binary "C:\tesseract\Tesseract-OCR\tesseract.exe;." `
            --add-binary "C:\tesseract\Tesseract-OCR\tessdata\eng.traineddata;tessdata"

      - name: 打包坐标抓取器
        run: pyinstaller --onefile --windowed --name GetCoords get_coords.py

      - name: 上传 CT_Scan_Tool
        uses: actions/upload-artifact@v6
        with:
          name: CT_Scan_Tool
          path: dist/CT_Scan_Tool.exe

      - name: 上传 GetCoords
        uses: actions/upload-artifact@v6
        with:
          name: GetCoords
          path: dist/GetCoords.exe
