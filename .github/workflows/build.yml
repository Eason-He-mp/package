name: Build Windows EXE

on:
  workflow_dispatch:            # 手动触发

jobs:
  build:
    runs-on: windows-2022       # Windows Server 2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x86'   # 32 位，确保兼容性

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 安装 Tesseract OCR (32-bit)
        shell: pwsh
        run: |
          $url = "https://github.com/UB-Mannheim/tesseract/releases/download/v5.5.0/tesseract-ocr-w32-setup-5.5.0.20250622.exe"
          Invoke-WebRequest -Uri $url -OutFile tesseract-installer.exe
          Start-Process -FilePath .\tesseract-installer.exe -ArgumentList "/S /D=C:\tesseract" -Wait
          if (!(Test-Path "C:\tesseract\tesseract.exe")) { exit 1 }

      - name: 打包 CT 扫描主程序
        run: |
          pyinstaller --onefile --windowed --name CT_Scan_Tool 2D_scan.py `
            --add-binary "C:\tesseract\tesseract.exe;." `
            --add-binary "C:\tesseract\tessdata\eng.traineddata;tessdata"

      - name: 打包坐标抓取器
        run: pyinstaller --onefile --windowed --name GetCoords get_coords.py

      - name: 上传 CT_Scan_Tool
        uses: actions/upload-artifact@v6
        with:
          name: CT_Scan_Tool
          path: dist/CT_Scan_Tool.exe

      - name: 上传 GetCoords
        uses: actions/upload-artifact@v6
        with:
          name: GetCoords
          path: dist/GetCoords.exe
