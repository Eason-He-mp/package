name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 检出代码（包含 Tesseract ZIP）
        uses: actions/checkout@v6

      - name: 设置 Python (32-bit)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 解压并准备 32 位 Tesseract
        shell: pwsh
        run: |
          $zipPath = "Tesseract-OCR.zip"
          if (!(Test-Path $zipPath)) { Write-Error "ZIP 文件未找到: $zipPath"; exit 1 }
          Expand-Archive -Path $zipPath -DestinationPath C:\tesseract -Force

          # 查找 tesseract.exe（支持任意子目录）
          $exe = Get-ChildItem -Path C:\tesseract -Recurse -Name "tesseract.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "在解压文件中未找到 tesseract.exe"; exit 1 }
          $exeFullPath = Join-Path C:\tesseract $exe
          if ($exeFullPath -ne "C:\tesseract\tesseract.exe") {
            Move-Item -Path $exeFullPath -Destination C:\tesseract\tesseract.exe -Force
          }

          # 查找 tessdata 文件夹
          $tessdata = Get-ChildItem -Path C:\tesseract -Recurse -Directory -Name "tessdata" | Select-Object -First 1
          if (-not $tessdata) { Write-Error "tessdata 文件夹未找到"; exit 1 }
          $tessdataFullPath = Join-Path C:\tesseract $tessdata
          if ($tessdataFullPath -ne "C:\tesseract\tessdata") {
            # 如果目标已存在，先删除再移动（避免冲突）
            if (Test-Path "C:\tesseract\tessdata") { Remove-Item "C:\tesseract\tessdata" -Recurse -Force }
            Move-Item -Path $tessdataFullPath -Destination C:\tesseract\tessdata -Force
          }

          # 最终验证
          if (!(Test-Path "C:\tesseract\tesseract.exe")) { Write-Error "tesseract.exe 未就位"; exit 1 }
          if (!(Test-Path "C:\tesseract\tessdata\eng.traineddata")) { Write-Error "eng.traineddata 未找到"; exit 1 }
          Write-Host "Tesseract 准备就绪"

      - name: 打包 CT 扫描主程序
        run: |
          pyinstaller --onefile --windowed --name CT_Scan_Tool 2D_scan.py `
            --add-binary "C:\tesseract\tesseract.exe;." `
            --add-binary "C:\tesseract\tessdata\eng.traineddata;tessdata"

      - name: 打包坐标抓取器
        run: pyinstaller --onefile --windowed --name GetCoords get_coords.py

      - name: 上传 CT_Scan_Tool
        uses: actions/upload-artifact@v6
        with:
          name: CT_Scan_Tool
          path: dist/CT_Scan_Tool.exe

      - name: 上传 GetCoords
        uses: actions/upload-artifact@v6
        with:
          name: GetCoords
          path: dist/GetCoords.exe
