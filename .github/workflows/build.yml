name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 检出代码（包含 Tesseract ZIP）
        uses: actions/checkout@v6

      - name: 设置 Python (32-bit)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 解压 32 位 Tesseract 便携版
        shell: pwsh
        run: |
          $zipPath = "Tesseract-OCR.zip"
          if (!(Test-Path $zipPath)) { Write-Error "ZIP 文件未找到: $zipPath"; exit 1 }
          Expand-Archive -Path $zipPath -DestinationPath C:\tesseract -Force

          # 验证 tesseract.exe 直接位于 C:\tesseract 根目录
          if (!(Test-Path "C:\tesseract\tesseract.exe")) { 
            Write-Error "tesseract.exe 未在 C:\tesseract 根目录找到"
            exit 1
          }
          # 验证 tessdata 文件夹及 eng.traineddata 文件
          if (!(Test-Path "C:\tesseract\tessdata\eng.traineddata")) {
            Write-Error "C:\tesseract\tessdata\eng.traineddata 未找到"
            exit 1
          }
          Write-Host "Tesseract 准备就绪"

      - name: 打包 CT 扫描主程序
        run: |
          pyinstaller --onefile --windowed --name CT_Scan_Tool 2D_scan.py `
            --add-binary "C:\tesseract\tesseract.exe;." `
            --add-binary "C:\tesseract\tessdata\eng.traineddata;tessdata"

      - name: 打包坐标抓取器
        run: pyinstaller --onefile --windowed --name GetCoords get_coords.py

      - name: 上传 CT_Scan_Tool
        uses: actions/upload-artifact@v6
        with:
          name: CT_Scan_Tool
          path: dist/CT_Scan_Tool.exe

      - name: 上传 GetCoords
        uses: actions/upload-artifact@v6
        with:
          name: GetCoords
          path: dist/GetCoords.exe
