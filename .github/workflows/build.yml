name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 下载并提取 Tesseract (32-bit portable)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 尝试通过 API 获取最新便携版
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/UB-Mannheim/tesseract/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "*w32-portable*" } | Select-Object -First 1
          if ($asset) {
            $download_url = $asset.browser_download_url
            Write-Host "找到最新便携版: $($asset.name)"
          } else {
            # 回退到已知存在的稳定版本 (v5.3.3)
            $download_url = "https://github.com/UB-Mannheim/tesseract/releases/download/v5.3.3/tesseract-ocr-w32-portable-5.3.3.zip"
            Write-Host "未找到最新便携版，使用回退版本: $download_url"
          }
          Invoke-WebRequest -Uri $download_url -OutFile portable.zip
          Expand-Archive portable.zip -DestinationPath C:\tesseract
          if (!(Test-Path "C:\tesseract\tesseract.exe")) { Write-Error "tesseract.exe 未找到"; exit 1 }
          if (!(Test-Path "C:\tesseract\tessdata\eng.traineddata")) { Write-Error "eng.traineddata 未找到"; exit 1 }

      - name: 打包 CT 扫描主程序
        run: |
          pyinstaller --onefile --windowed --name CT_Scan_Tool 2D_scan.py `
            --add-binary "C:\tesseract\tesseract.exe;." `
            --add-binary "C:\tesseract\tessdata\eng.traineddata;tessdata"

      - name: 打包坐标抓取器
        run: pyinstaller --onefile --windowed --name GetCoords get_coords.py

      - name: 上传 CT_Scan_Tool
        uses: actions/upload-artifact@v6
        with:
          name: CT_Scan_Tool
          path: dist/CT_Scan_Tool.exe

      - name: 上传 GetCoords
        uses: actions/upload-artifact@v6
        with:
          name: GetCoords
          path: dist/GetCoords.exe
